# Dedicated Secret fixture for the cluster-MUTATING SC3 delete spec
# (e2e/secrets-delete-resync.spec.ts).
#
# Why this exists (reconcile task rct_20260729-0001):
#   SC3 (External Secret 재동기화 유도 — 대상 Secret 삭제) issues a REAL DELETE
#   /api/secrets/:ns/:name and asserts the target Secret is actually removed.
#   Previously the spec targeted the SHARED `test-secret` fixture that SC1
#   (secrets-tab) and SC2 (secrets-reveal) also read, so a real delete would
#   remove that shared fixture — and the kind harness installs the ExternalSecret
#   CRD only, with NO controller/webhook (scripts/kind-cluster.sh
#   install_external_secrets_crds), so nothing recreates it — polluting the other
#   secrets specs. The earlier approach mocked the DELETE to avoid this; review
#   asked for a real delete against a dedicated fixture instead.
#
#   Fix (mirrors test/fixtures/fluxcd-mut-fixtures.yaml): give the SC3 delete spec
#   its OWN dedicated Secret here, disjoint from anything SC1/SC2/SC4 assert on.
#   Those readers target `test-secret` / `tls-secret` by testid and only ever
#   assert `>= 2` secret accordions, so deleting this third fixture always leaves
#   test-secret + tls-secret behind and never breaks them. This Secret stands in
#   for an ESO-managed target Secret; with no ESO controller present, resync
#   recreation is out of harness scope, so the spec verifies the app-owned real
#   delete (request issued + Secret removed from the cluster and the list).
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-mut-delete
  namespace: dashboard-test
  labels:
    app: kubernetes-dashboard
    env: test
    purpose: sc3-delete-target
type: Opaque
stringData:
  username: "sc3-delete-user"
  password: "sc3-delete-password-12345"
  token: "sc3-delete-token-abcdef"
