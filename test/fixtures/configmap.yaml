apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: dashboard-test
  labels:
    app: kubernetes-dashboard
    env: test
data:
  app.properties: |
    log.level=debug
    feature.flag=true
    timeout=30s
  nginx.conf: |
    server {
      listen 80;
      server_name localhost;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: dashboard-test
  labels:
    app: kubernetes-dashboard
    env: test
data:
  feature.flags: |
    new-ui=true
    beta-search=false
  log.level: info
