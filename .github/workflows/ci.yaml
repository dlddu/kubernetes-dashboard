name: CI

on:
  push:
    branches: [main, dld-280-project-scaffolding]
  pull_request:

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Vite is installed
        run: |
          if ! npm list vite > /dev/null 2>&1; then
            echo "ERROR: Vite not found in dependencies"
            exit 1
          fi

      - name: Verify Tailwind CSS is installed
        run: |
          if ! npm list tailwindcss > /dev/null 2>&1; then
            echo "ERROR: Tailwind CSS not found in dependencies"
            exit 1
          fi

      - name: Run linter
        run: npm run lint --if-present

      - name: Run type check
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d dist ]; then
            echo "ERROR: Frontend build output (dist/) not found"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify go.mod exists
        run: |
          if [ ! -f go.mod ]; then
            echo "ERROR: go.mod not found"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Ensure go.mod is tidy
        run: go mod tidy

      - name: Verify dependencies
        run: |
          if ! go list -m k8s.io/client-go > /dev/null 2>&1; then
            echo "ERROR: k8s.io/client-go dependency not found"
            exit 1
          fi

      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for embedding
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check test coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

      - name: Upload Go coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: backend
          name: go-coverage

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Ensure go.mod is tidy
        run: go mod tidy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name integration-test
          kubectl cluster-info

      - name: Run Go handler tests with cluster
        run: go test -v -race ./handlers/

      - name: Build Go binary
        run: go build -o kubernetes-dashboard .

      - name: Test binary execution
        run: |
          ./kubernetes-dashboard &
          SERVER_PID=$!
          sleep 3

          # Test liveness endpoint
          if ! curl -f http://localhost:8080/api/livez; then
            echo "ERROR: Liveness endpoint not responding"
            kill $SERVER_PID
            exit 1
          fi

          # Test SPA serving
          if ! curl -f http://localhost:8080/; then
            echo "ERROR: SPA not being served"
            kill $SERVER_PID
            exit 1
          fi

          kill $SERVER_PID
          echo "Integration tests passed!"

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name integration-test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04-arm
    needs: [go-test, frontend-test]
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지는 언제나 커밋 SHA 태그로 올린다. 운영은 이 태그를 deploy 브랜치에서
      # 고정해 당기므로(아래 `pin`), PR 빌드가 올린 이미지는 운영에 닿지 않는다.
      # `:latest` 는 main 푸시에서만 함께 옮긴다(로컬·수동 확인용, 운영은 쓰지 않음).
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker container test
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run -d -p 8080:8080 --name test-container ghcr.io/${{ github.repository }}:${{ github.sha }}
          sleep 5

          # Test liveness endpoint
          if ! curl -f http://localhost:8080/api/livez; then
            echo "ERROR: Docker container liveness check failed"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          # Verify JSON response
          RESPONSE=$(curl -s http://localhost:8080/api/livez)
          if ! echo "$RESPONSE" | jq -e '.status == "ok"' > /dev/null 2>&1; then
            echo "ERROR: Invalid liveness response: $RESPONSE"
            docker stop test-container
            exit 1
          fi

          docker stop test-container
          echo "Docker container tests passed!"

  pin:
    name: pin deployment image (main only)
    needs: [docker-build]
    # main 푸시에서만 운영 매니페스트를 이 SHA 로 고정해 deploy 브랜치로 발행한다.
    # Flux 는 main 이 아니라 deploy 를 추적한다(flux-cd
    # `cluster/infrastructure/60-apps/kubernetes-dashboard-app.yaml`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # 이 job 만 deploy 브랜치에 push 한다.
      contents: write
    steps:
      # 방금 빌드한 커밋 그대로를 deploy 의 부모로 삼는다. 전체 히스토리는 아래
      # 「더 새 커밋이 이미 발행됐는가」 조상 판정에 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin k8s/deployment.yaml image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          f=k8s/deployment.yaml
          sed -i -E "s#(ghcr\.io/dlddu/kubernetes-dashboard):[A-Za-z0-9._-]+#\1:${SHA}#g" "$f"

          # sed 가 조용히 빗나가지 않았는지 확인한다: 고정되지 않은 참조가 없고,
          # 고정된 참조가 최소 하나 있어야 한다.
          leftover=$(grep -oE "ghcr\.io/dlddu/kubernetes-dashboard:[A-Za-z0-9._-]+" "$f" \
                       | grep -v ":${SHA}\$" || true)
          if [ -n "$leftover" ]; then
            echo "::error::$f: 고정되지 않은 이미지 참조가 남았습니다:"
            echo "$leftover"
            exit 1
          fi
          n=$(grep -cE "ghcr\.io/dlddu/kubernetes-dashboard:${SHA}" "$f" || true)
          [ "$n" -ge 1 ] || { echo "::error::$f: 고정된 참조가 없습니다"; exit 1; }

          # 「main@SHA + 고정 커밋 하나」를 deploy 로 force-push 한다. main 은 ruleset 으로
          # 보호되어 봇이 직접 커밋할 수 없다. 기본 GITHUB_TOKEN 의 push 는 새 워크플로를
          # 트리거하지 않는다.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          # 늦게 끝난 옛 실행이 더 새 배포를 덮지 않게 한다. deploy 끝 커밋의
          # Source-Commit 트레일러가 이 SHA 의 후손이면 건너뛴다.
          # (롤백은 main 에 revert PR 을 올리는 것 — 그 머지가 새 SHA 로 다시 여기를 탄다.)
          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy 는 이미 더 새로운 main 커밋(${cur})을 가리킨다 — 건너뜀."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: kubernetes-dashboard 이미지를 ${SHA} 로 고정" \
            -m "Source-Commit: ${SHA}"

          # lease 로 「읽은 뒤 누가 먼저 밀었으면」 실패시킨다(old 가 비면 = 브랜치가 없어야 함).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy

  k8s-manifest-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify manifest directory exists
        run: |
          if [ ! -d k8s ]; then
            echo "ERROR: k8s directory not found"
            exit 1
          fi

      - name: Verify required manifests exist
        run: |
          REQUIRED_FILES=("deployment.yaml" "service.yaml" "rbac.yaml")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "k8s/$file" ]; then
              echo "ERROR: Required file k8s/$file not found"
              exit 1
            fi
          done

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests with kubeconform
        run: |
          kubeconform -summary -output json k8s/*.yaml

      - name: Check RBAC configuration
        run: |
          if ! grep -q "kind: ServiceAccount" k8s/rbac.yaml; then
            echo "ERROR: ServiceAccount not found in RBAC manifest"
            exit 1
          fi
          if ! grep -q "kind: ClusterRole" k8s/rbac.yaml; then
            echo "ERROR: ClusterRole not found in RBAC manifest"
            exit 1
          fi
          if ! grep -q "kind: ClusterRoleBinding" k8s/rbac.yaml; then
            echo "ERROR: ClusterRoleBinding not found in RBAC manifest"
            exit 1
          fi

  # DLD-437: Argo Workflows CRD 설치 및 e2e 테스트 환경 구성
  argo-fixture-validation:
    name: Argo Fixture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Ensure go.mod is tidy
        run: go mod tidy

      # Shell-level static analysis: checks kind-cluster.sh and apply-all.sh structure
      - name: Run Argo cluster script tests (shell)
        run: |
          chmod +x ./test/argo_cluster_script_test.sh
          ./test/argo_cluster_script_test.sh

      # Go-level YAML structural validation of all Argo fixture CRs
      - name: Run Argo fixture YAML validation (Go)
        run: |
          go test -v -run TestArgoFixture ./test/...
          go test -v -run TestWorkflow ./test/...
          go test -v -run TestApplyAllSh ./test/...
          go test -v -run TestKindClusterSh ./test/...

  # DLD-743: e2e 테스트 환경에 FluxCD CRD 등록
  fluxcd-fixture-validation:
    name: FluxCD Fixture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Ensure go.mod is tidy
        run: go mod tidy

      # Shell-level static analysis: checks kind-cluster.sh and apply-all.sh structure
      - name: Run FluxCD cluster script tests (shell)
        run: |
          chmod +x ./test/fluxcd_cluster_script_test.sh
          ./test/fluxcd_cluster_script_test.sh

      # Go-level YAML structural validation of all FluxCD fixture CRs
      - name: Run FluxCD fixture YAML validation (Go)
        run: |
          go test -v -run TestFluxCDFixture ./test/...
          go test -v -run TestKustomization ./test/...
          go test -v -run TestApplyAllShIncludesFluxCD ./test/...
          go test -v -run TestKindClusterShHasInstallFluxCD ./test/...
